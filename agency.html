<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b6b45">
<title>CheckAm approval notice</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=1795548489">
</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="./"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0b6b45"/><path d="M11 21l6 6 12-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>CheckAm<small>approval notice</small></a>
</div></header>
<main id="view" style="max-width:780px" aria-live="polite"><p class="sub">Loading…</p></main>
<div class="toast" id="toast" role="status"></div>
<script src="config.js?v=1795548489"></script>
<script src="portal.js?v=1795548489"></script>
<script>
{
  const { $, esc, fmtDate, publicRpc, errText, toast } = window.CK;
  const token = new URLSearchParams(location.search).get('t') || '';
  const view = $('view');
  async function load() {
    if (!/^[0-9a-f-]{36}$/i.test(token)) { view.innerHTML = '<div class="card"><h2>This link is not complete</h2><p class="sub" style="margin-top:8px">Open the full link from the CheckAm email.</p></div>'; return; }
    let d;
    try { d = await publicRpc('agency_view', { p_token: token }); } catch (e) { view.innerHTML = '<div class="card"><h2>Could not load</h2><p class="err">' + esc(errText(e)) + '</p></div>'; return; }
    if (!d) { view.innerHTML = '<div class="card"><h2>This link is not valid</h2></div>'; return; }
    const c = d.company;
    view.innerHTML = '<div class="stack">' +
      '<div><p class="sub">For ' + esc(d.agency) + '</p><h1 style="font-size:36px">' + esc(c.legal_name) + '</h1></div>' +
      (d.objection
        ? '<div class="banner bad"><h3>' + esc(d.agency) + ' has objected</h3><p>' + esc(d.objection_note || '') + '</p><p class="note">The company is suspended on CheckAm. Its products do not show as Genuine.</p></div>'
        : '<div class="banner ' + (c.status === 'approved' ? 'ok' : 'warn') + '"><h3' + (c.status === 'approved' ? ' style="color:#fff"' : '') + '>Approved on CheckAm' + (c.approved_at ? ' on ' + esc(fmtDate(c.approved_at)) : '') + '</h3><p>This approval relied on ' + esc(d.agency) + '\'s public records. If the company should not be approved, please object below. It is suspended immediately.</p></div>') +
      '<section class="card"><h3>Company</h3><table class="t" style="margin-top:8px"><tbody>' +
        [['CAC RC number', c.rc_number], ['Type', c.kind], ['Address', [c.factory_address, c.city, c.state].filter(Boolean).join(', ')], ['Website', c.website], ['Email', c.official_email], ['Phone', c.public_phone]].map(([k, v]) => '<tr><th style="width:36%">' + esc(k) + '</th><td>' + esc(v || '—') + '</td></tr>').join('') +
      '</tbody></table></section>' +
      '<section class="card"><h3>Products</h3><div class="scroll"><table class="t" style="margin-top:8px"><thead><tr><th>Product</th><th>NAFDAC no.</th><th>GTIN</th></tr></thead><tbody>' +
        (d.products || []).map(p => '<tr><td>' + esc(p.name) + ' <span class="note">' + esc(p.strength || '') + '</span></td><td>' + esc(p.nafdac_no) + '</td><td>' + esc(p.gtin || '—') + '</td></tr>').join('') +
      '</tbody></table></div></section>' +
      (d.objection
        ? '<section class="card"><h3>Resolved?</h3><p class="sub" style="margin-top:6px">If the company has cleared the matter with ' + esc(d.agency) + ', withdraw the objection. Its approval returns automatically.</p><p class="err" id="err" role="alert"></p><button class="btn" id="wd" type="button">Withdraw objection</button></section>'
        : '<section class="card"><h3>Object to this approval</h3><label class="f" for="why">Reason <small>(the company will see this)</small></label><textarea class="input" id="why" placeholder="e.g. Registration number A4-1234 is not held by this company"></textarea><p class="err" id="err" role="alert"></p><button class="btn danger" id="ob" type="button">Object and suspend</button></section>') +
      '<p class="note">CheckAm is a free public app that helps Nigerians check medicine packs. No account is needed to use this page. Questions: reply to the email you received.</p></div>';
    const ob = $('ob'); if (ob) ob.addEventListener('click', async () => {
      const why = $('why').value.trim(); if (why.length < 5) { $('err').textContent = 'Please give a short reason.'; return; }
      ob.disabled = true;
      try { await publicRpc('agency_object', { p_token: token, p_note: why }); toast('Objection recorded. The company is suspended.'); load(); }
      catch (e) { $('err').textContent = errText(e); ob.disabled = false; }
    });
    const wd = $('wd'); if (wd) wd.addEventListener('click', async () => {
      wd.disabled = true;
      try { await publicRpc('agency_withdraw', { p_token: token }); toast('Objection withdrawn'); load(); }
      catch (e) { $('err').textContent = errText(e); wd.disabled = false; }
    });
  }
  load();
}
</script>
</body>
</html>
